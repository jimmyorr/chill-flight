<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Luminous golden peach sunset gradient with warm open sky -->
    <linearGradient id="sunset-fav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#324080" />
      <stop offset="10%" stop-color="#5a4580" />
      <stop offset="22%" stop-color="#965278" />
      <stop offset="34%" stop-color="#d46759" />
      <stop offset="48%" stop-color="#f58055" />
      <stop offset="64%" stop-color="#fca266" />
      <stop offset="80%" stop-color="#fdbf7a" />
      <stop offset="100%" stop-color="#ffe0a4" />
    </linearGradient>

    <!-- Circular badge boundary for sharp tab display across dark and light browser themes -->
    <clipPath id="fav-circle-clip">
      <circle cx="256" cy="256" r="230" />
    </clipPath>
  </defs>

  <g clip-path="url(#fav-circle-clip)">
    <!-- Sky background -->
    <circle cx="256" cy="256" r="230" fill="url(#sunset-fav)" />

    <!-- Low-poly faceted mountain peaks with open sky clearance -->
    <!-- Distant background peaks -->
    <polygon points="10,512 110,310 220,512" fill="#548979" />
    <polygon points="250,512 410,280 500,512" fill="#14413f" />

    <!-- Center majestic mountain -->
    <!-- Sunlit facet -->
    <polygon points="70,512 250,250 285,512" fill="#88a886" />
    <!-- Shadow facet -->
    <polygon points="250,250 440,512 285,512" fill="#296e63" />

    <!-- Foreground foothill facet -->
    <polygon points="150,512 295,370 380,512" fill="#1d5750" />
    <polygon points="150,512 295,370 240,512" fill="#6d9988" />
  </g>
</svg>
