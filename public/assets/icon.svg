<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Muted dusk sunset gradient sampled directly from app_icon.png -->
    <linearGradient id="sunset-fav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#25367a" />
      <stop offset="25%" stop-color="#4e3e7f" />
      <stop offset="48%" stop-color="#7c4979" />
      <stop offset="68%" stop-color="#bc5a5e" />
      <stop offset="84%" stop-color="#f16f4a" />
      <stop offset="94%" stop-color="#f88655" />
      <stop offset="100%" stop-color="#faab72" />
    </linearGradient>

    <!-- Circular badge boundary for sharp tab display across dark and light browser themes -->
    <clipPath id="fav-circle-clip">
      <circle cx="256" cy="256" r="230" />
    </clipPath>
  </defs>

  <g clip-path="url(#fav-circle-clip)">
    <!-- Sky background -->
    <circle cx="256" cy="256" r="230" fill="url(#sunset-fav)" />

    <!-- Low-poly faceted mountain ridge matching in-game procedural terrain -->
    <!-- Distant background peaks -->
    <polygon points="10,512 110,290 220,512" fill="#548979" />
    <polygon points="250,512 410,250 500,512" fill="#14413f" />

    <!-- Center majestic mountain -->
    <!-- Sunlit facet -->
    <polygon points="70,512 250,220 285,512" fill="#88a886" />
    <!-- Shadow facet -->
    <polygon points="250,220 440,512 285,512" fill="#296e63" />

    <!-- Foreground foothill facet -->
    <polygon points="150,512 295,350 380,512" fill="#1d5750" />
    <polygon points="150,512 295,350 240,512" fill="#6d9988" />
  </g>
</svg>
