<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug | Faces</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --accent-color: #38bdf8;
        --text-color: #f1f5f9;
        --muted: #94a3b8;
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg-color);
        color: var(--text-color);
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      .sub {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 13px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        margin-bottom: 24px;
        font-size: 14px;
      }
      .controls label {
        display: flex;
        gap: 6px;
        align-items: center;
        cursor: pointer;
      }
      #faces {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      .face-card {
        background: var(--card-bg);
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        scroll-margin-top: 24px;
        text-decoration: none;
        color: inherit;
        transition:
          transform 0.15s ease,
          border-color 0.15s ease,
          box-shadow 0.15s ease;
        cursor: pointer;
      }
      .face-card:hover {
        transform: translateY(-2px);
        border-color: var(--accent-color);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      }
      .face-card:target {
        border-color: var(--accent-color);
      }
      .face-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .face-card h2 {
        margin: 0;
        font-size: 15px;
      }
      .face-card .meta {
        color: var(--muted);
        font-size: 12px;
      }
      .face-card .badge {
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(56, 189, 248, 0.12);
        color: var(--accent-color);
        font-weight: 500;
      }
      .face-card .view-dialog {
        margin-top: 4px;
        font-size: 12px;
        color: var(--accent-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      /* Like the dialog's portrait: whole screen pixels per face pixel */
      canvas {
        image-rendering: pixelated;
        background: #f2d9a6;
        border: 2px solid #2b1d16;
        border-radius: 6px;
      }
      body.dark canvas {
        background: #18120e;
      }
    </style>
  </head>
  <body>
    <h1>Faces</h1>
    <p class="sub">
      Everyone's face in <code>faces.js</code>, with their airport from
      <code>people.js</code>, and each of their outfits. Tap a person to view
      all their dialog. Link to one with #name.
    </p>
    <div class="controls">
      <input
        type="search"
        id="search"
        placeholder="Filter people..."
        aria-label="Filter people"
        style="
          padding: 6px 10px;
          background: var(--card-bg);
          border: 1px solid #334155;
          border-radius: 6px;
          color: var(--text-color);
          font-size: 13px;
        "
      />
      <label
        >Size
        <select id="size">
          <option value="96">96 px (dialog)</option>
          <option value="192" selected>192 px</option>
          <option value="288">288 px</option>
        </select></label
      >
      <label><input type="checkbox" id="talking" checked /> Talking</label>
      <label
        ><input type="checkbox" id="closed" /> Mouth closed (when not
        talking)</label
      >
      <label
        ><input type="checkbox" id="hidden" /> Not met yet (silhouette)</label
      >
      <label><input type="checkbox" id="dark" /> Dark background</label>
    </div>
    <div id="faces"></div>

    <script type="module">
      import {
        FACES,
        MOUTH_SECONDS,
        BLINK_SECONDS,
        BLINK_SHUT_SECONDS,
        drawFace,
      } from '/faces.js';
      import {PEOPLE} from '/people.js';

      // Redirect if person is in query params
      const urlParams = new URLSearchParams(window.location.search);
      const targetPerson = urlParams.get('person') || urlParams.get('name');
      if (targetPerson) {
        window.location.replace(
          `debug-person.html?person=${encodeURIComponent(targetPerson)}`
        );
      }

      const talking = document.getElementById('talking');
      const closed = document.getElementById('closed');
      const hidden = document.getElementById('hidden');
      const dark = document.getElementById('dark');
      const size = document.getElementById('size');
      const search = document.getElementById('search');
      const container = document.getElementById('faces');

      // A card for each face and each of its outfits
      const all = Object.entries(FACES).flatMap(([name, face]) => [
        {name, face, i: 0, outfit: 'usual'},
        ...Object.entries(face.outfits || {}).map(([outfit, f]) => ({
          name,
          face: f,
          i: 1,
          outfit,
        })),
      ]);
      const cards = all.map(({name, face, i, outfit}) => {
        const card = document.createElement('a');
        card.className = 'face-card';
        if (!i) card.id = name.toLowerCase();
        card.href = `debug-person.html?person=${encodeURIComponent(name)}`;
        const person = PEOPLE.find((p) => p.name === name);
        const airport = person?.airport;
        const jobCount = person?.jobs?.length || 0;
        const jobText = jobCount === 1 ? '1 job' : `${jobCount} jobs`;

        card.innerHTML = `
          <div class="face-card-header">
            <h2>${name}${FACES[name].outfits ? ` · ${outfit}` : ''}</h2>
            <span class="badge">${jobText}</span>
          </div>
          <div class="meta">${airport || 'Not in people.js yet'}</div>`;
        const canvas = document.createElement('canvas');
        card.append(canvas);
        const viewLink = document.createElement('div');
        viewLink.className = 'view-dialog';
        viewLink.innerHTML = '<span>View dialog</span><span>→</span>';
        card.append(viewLink);
        container.append(card);
        return {name, airport: airport || '', face, canvas, card};
      });

      // Filter handling
      search.addEventListener('input', () => {
        const query = search.value.trim().toLowerCase();
        for (const {name, airport, card} of cards) {
          const match =
            !query ||
            name.toLowerCase().includes(query) ||
            airport.toLowerCase().includes(query);
          card.style.display = match ? 'flex' : 'none';
        }
      });

      function resize() {
        for (const {canvas} of cards) {
          canvas.style.width = canvas.style.height = `${size.value}px`;
        }
      }
      resize();
      size.addEventListener('change', resize);

      // Cards are added after load, so jump to #name by hand
      if (location.hash) {
        document.getElementById(location.hash.slice(1))?.scrollIntoView();
      }

      function draw(now) {
        requestAnimationFrame(draw);
        const beat = Math.floor(now / 1000 / MOUTH_SECONDS) % 2 === 1;
        const mouthClosed = talking.checked ? beat : closed.checked;
        const eyesClosed = (now / 1000) % BLINK_SECONDS < BLINK_SHUT_SECONDS;
        for (const {face, canvas} of cards) {
          drawFace(canvas, face, {
            mouthClosed,
            eyesClosed,
            hidden: hidden.checked,
          });
        }
      }
      requestAnimationFrame(draw);

      dark.addEventListener('change', () =>
        document.body.classList.toggle('dark', dark.checked)
      );
      closed.disabled = talking.checked;
      talking.addEventListener('change', () => {
        closed.disabled = talking.checked;
      });
    </script>
  </body>
</html>
