<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug | Export map</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/style.css" />
    <style>
      body {
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: flex-start;
        font-family: 'Courier New', Courier, monospace;
        color: white;
        background: #0f172a;
      }

      .debug-menu-box {
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        width: 320px;
        box-sizing: border-box;
      }

      h1 {
        margin: 0 0 16px;
        font-weight: 300;
        letter-spacing: 2px;
        font-size: 22px;
      }

      .input-row {
        display: flex;
        gap: 10px;
      }

      .input-group {
        margin-bottom: 12px;
        flex: 1;
      }

      .input-group label {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
        color: #ccc;
      }

      .input-group input,
      .input-group select {
        width: 100%;
        padding: 8px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        color: white;
        font-family: inherit;
        box-sizing: border-box;
      }

      .input-group select option {
        background: #0f172a;
      }

      .check {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 13px;
        color: #ccc;
        margin-bottom: 12px;
      }

      .debug-btn {
        display: block;
        width: 100%;
        margin-top: 10px;
        color: white;
        text-decoration: none;
        text-align: center;
        background: rgba(56, 189, 248, 0.2);
        border: 1px solid rgba(56, 189, 248, 0.5);
        border-radius: 6px;
        padding: 10px 16px;
        font-family: inherit;
        font-size: 14px;
        box-sizing: border-box;
        cursor: pointer;
      }

      .debug-btn:hover {
        background: rgba(56, 189, 248, 0.4);
      }

      .debug-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .return-btn {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      #status {
        margin-top: 12px;
        font-size: 13px;
        color: #38bdf8;
        min-height: 18px;
      }

      #preview {
        flex: 1;
        min-width: 0;
        overflow: auto;
        max-height: calc(100vh - 40px);
      }

      #preview canvas {
        display: block;
        image-rendering: pixelated;
      }

      #preview canvas.fit {
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="debug-menu-box">
      <h1>Export map</h1>

      <div class="input-group">
        <label>Seed</label>
        <input type="number" id="input-seed" />
      </div>

      <div class="input-group">
        <label>Continent</label>
        <select id="input-continent">
          <option value="">Chosen by the seed</option>
        </select>
      </div>

      <div class="input-row">
        <div class="input-group">
          <label>Centre lat (°N)</label>
          <input type="number" id="input-lat" value="0" step="0.5" />
        </div>
        <div class="input-group">
          <label>Centre long (°E)</label>
          <input type="number" id="input-long" value="0" step="0.5" />
        </div>
      </div>

      <div class="input-row">
        <div class="input-group">
          <label>Width (°)</label>
          <input type="number" id="input-width" value="12" min="0.1" />
        </div>
        <div class="input-group">
          <label>Height (°)</label>
          <input type="number" id="input-height" value="12" min="0.1" />
        </div>
      </div>

      <div class="input-group">
        <label>Units per pixel (1° = 5000 units)</label>
        <input type="number" id="input-scale" value="50" min="1" />
      </div>

      <div class="input-group">
        <label>Style</label>
        <select id="input-mode">
          <option value="color">Map colours</option>
          <option value="gray">Grayscale heightmap</option>
        </select>
      </div>

      <label class="check"
        ><input type="checkbox" id="input-grid" checked /> Lat/long grid</label
      >

      <button class="debug-btn" id="btn-world">Whole world</button>
      <button class="debug-btn" id="btn-render">Render</button>
      <button class="debug-btn" id="btn-download" disabled>Download PNG</button>
      <div id="status"></div>

      <a href="debug.html" class="debug-btn return-btn" style="margin-top: 24px"
        >Back</a
      >
    </div>

    <div id="preview"></div>

    <script type="module">
      import {ChillFlightLogic} from '../chill-flight-logic.js';

      // URL params prefill the form (seed, continent, lat, long, w, h, upp, mode,
      // grid=0) and run=1 renders straight away
      const params = new URLSearchParams(location.search);
      const field = (id, key) => {
        const el = document.getElementById(id);
        if (params.has(key)) el.value = params.get(key);
        return el;
      };
      const seedEl = field('input-seed', 'seed');
      const continentEl = document.getElementById('input-continent');
      for (const name of ChillFlightLogic.CONTINENT_NAMES) {
        continentEl.add(new Option(name, name));
      }
      field('input-continent', 'continent');
      if (!seedEl.value) seedEl.value = ChillFlightLogic.WORLD_SEED;
      const latEl = field('input-lat', 'lat');
      const longEl = field('input-long', 'long');
      const widthEl = field('input-width', 'w');
      const heightEl = field('input-height', 'h');
      const scaleEl = field('input-scale', 'upp');
      const modeEl = field('input-mode', 'mode');
      const gridEl = document.getElementById('input-grid');
      if (params.get('grid') === '0') gridEl.checked = false;
      const statusEl = document.getElementById('status');
      const renderBtn = document.getElementById('btn-render');
      const downloadBtn = document.getElementById('btn-download');
      const preview = document.getElementById('preview');

      const DEG = 5000; // units per degree
      const BAND = 32; // rows per worker job
      const MAX_PIXELS = 64e6;
      const workerCount = Math.max(
        1,
        Math.min(8, (navigator.hardwareConcurrency || 4) - 1)
      );
      const workers = Array.from(
        {length: workerCount},
        () =>
          new Worker(new URL('../map-worker.js', import.meta.url), {
            type: 'module',
          })
      );

      let canvas = null;
      let fileName = '';
      let renderId = 0;

      // Everything out to the open ocean east and west (past 20°), and well
      // past the ice and desert north and south
      document.getElementById('btn-world').addEventListener('click', () => {
        latEl.value = 0;
        longEl.value = 0;
        widthEl.value = 44;
        heightEl.value = 24;
        scaleEl.value = 150;
        render();
      });
      renderBtn.addEventListener('click', render);
      downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = fileName;
        link.click();
      });

      function degLabel(d, pos, neg) {
        const v = Math.round(d * 100) / 100;
        return v === 0 ? '0°' : `${Math.abs(v)}° ${v > 0 ? pos : neg}`;
      }

      // Lines every 1, 2, 5 or 10 degrees, so there are about ten across
      function gridStep(spanDeg) {
        return [0.5, 1, 2, 5, 10].find((s) => spanDeg / s <= 12) || 20;
      }

      function drawGrid(ctx, x0, z0, upp, w, h) {
        const fontPx = Math.max(11, Math.round(Math.min(w, h) / 70));
        ctx.lineWidth = Math.max(1, fontPx / 12);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.font = `${fontPx}px Courier New`;
        const step = gridStep(Math.max(w, h) * (upp / DEG));
        // Longitude lines, labelled along the top
        const xStart = Math.ceil(x0 / DEG / step) * step;
        for (let d = xStart; d * DEG <= x0 + w * upp; d += step) {
          const cx = (d * DEG - x0) / upp;
          ctx.beginPath();
          ctx.moveTo(cx, 0);
          ctx.lineTo(cx, h);
          ctx.stroke();
          ctx.fillText(degLabel(d, 'E', 'W'), cx + 4, fontPx + 2);
        }
        // Latitude lines (north is negative Z), labelled down the left
        const zStart = Math.ceil(z0 / DEG / step) * step;
        for (let d = zStart; d * DEG <= z0 + h * upp; d += step) {
          const cy = (d * DEG - z0) / upp;
          ctx.beginPath();
          ctx.moveTo(0, cy);
          ctx.lineTo(w, cy);
          ctx.stroke();
          ctx.fillText(degLabel(-d, 'N', 'S'), 4, cy - 4);
        }
      }

      function render() {
        const seed = parseInt(seedEl.value) || ChillFlightLogic.WORLD_SEED;
        const lat = parseFloat(latEl.value) || 0;
        const long = parseFloat(longEl.value) || 0;
        const wDeg = parseFloat(widthEl.value) || 12;
        const hDeg = parseFloat(heightEl.value) || 12;
        const upp = parseFloat(scaleEl.value) || 50;
        const mode = modeEl.value;
        const grid = gridEl.checked;

        const w = Math.round((wDeg * DEG) / upp);
        const h = Math.round((hDeg * DEG) / upp);
        if (w * h > MAX_PIXELS) {
          statusEl.innerText = `${w}x${h} is too big: raise units per pixel or shrink the area.`;
          return;
        }
        const x0 = long * DEG - (w * upp) / 2;
        const z0 = -lat * DEG - (h * upp) / 2;

        const id = ++renderId;
        canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.className = 'fit';
        canvas.title = 'Click to toggle full size';
        canvas.addEventListener('click', () => canvas.classList.toggle('fit'));
        const ctx = canvas.getContext('2d');
        preview.replaceChildren(canvas);
        downloadBtn.disabled = true;
        fileName = `map-${seed}-${lat}N-${long}E-${wDeg}x${hDeg}deg-${upp}upp-${mode}.png`;

        const jobs = [];
        for (let r = 0; r < h; r += BAND) jobs.push([r, Math.min(h, r + BAND)]);
        const total = jobs.length;
        let done = 0;
        const started = performance.now();
        statusEl.innerText = `Rendering ${w}x${h} on ${workerCount} workers...`;

        const next = (worker) => {
          const job = jobs.shift();
          if (!job) return;
          worker.onmessage = (e) => {
            if (e.data.id !== renderId) return;
            const {rowStart, rowEnd, pixels} = e.data;
            ctx.putImageData(
              new ImageData(pixels, w, rowEnd - rowStart),
              0,
              rowStart
            );
            done++;
            if (done < total) {
              statusEl.innerText = `Rendering ${w}x${h}... ${Math.floor((done / total) * 100)}%`;
              next(worker);
              return;
            }
            if (grid) drawGrid(ctx, x0, z0, upp, w, h);
            const secs = ((performance.now() - started) / 1000).toFixed(1);
            statusEl.innerText = `${w}x${h} in ${secs}s.`;
            downloadBtn.disabled = false;
            document.body.dataset.rendered = String(id);
          };
          worker.postMessage({
            id,
            seed,
            continent: continentEl.value || null,
            x0,
            z0,
            upp,
            width: w,
            rowStart: job[0],
            rowEnd: job[1],
            mode,
          });
        };
        workers.forEach(next);
      }

      if (params.get('run') === '1') render();
    </script>
  </body>
</html>
